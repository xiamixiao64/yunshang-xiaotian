<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fbe3ec 0%,#e6ebff 50%,#ddeff2 100%);
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  #stage {
    position:relative; width:min(100vw, 56.25vh); height:min(177.78vw, 100vh);
    overflow:hidden; touch-action:none; background:#bfe3ff;

    position:absolute; top:58px; left:0; right:0;

  .pill {
    background:rgba(255,253,250,.9); backdrop-filter:blur(6px);

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
import * as SkeletonUtils from './lib/jsm/utils/SkeletonUtils.js';
import { EffectComposer } from './lib/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './lib/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './lib/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './lib/jsm/postprocessing/OutputPass.js';

/* ================= GLB 专业模型资产（CC0 / 已附出处） ================= */
const GLB_FILES = {
  tulip:       'assets/models/tulip.glb',
  daisy:       'assets/models/daisy.glb',
  sunflower:   'assets/models/sunflower.glb',
  rose:        'assets/models/rose.glb',
  petal_pink:  'assets/models/petal_pink.glb',
  cherry:      'assets/models/cherry.glb',
  fountain:    'assets/models/fountain.glb',
  bench:       'assets/models/bench.glb',
  fence:       'assets/models/fence.glb',
  lantern:     'assets/models/lantern.glb',
  bush_flower: 'assets/models/bush_flower.glb',
  hedge:       'assets/models/hedge.glb',
  well:        'assets/models/well.glb',
  /* GLB 角色：蒙皮已修复，马卡龙调色 + Toon 化后契合画风 */
  farmer:      'assets/models/woman.glb',
};
const GLB = {};
const GLB_ANIMS = {};
let assetsReady = false;
let glbLoadedCount = 0;
const gltfLoader = new GLTFLoader();
function loadGLBAssets(){
  const jobs = Object.entries(GLB_FILES).map(([k, url])=> new Promise(res=>{
    gltfLoader.load(url,
      g => { GLB[k] = g.scene; GLB_ANIMS[k] = g.animations || []; res(); },
      undefined,
      () => { console.warn('GLB 加载失败(将用程序模型兜底):', k); res(); });
  }).then(()=>{ glbLoadedCount++; }));
  return Promise.all(jobs).then(()=>{ assetsReady = true; });
}
loadGLBAssets();
/* 取一个 GLB 模型：自动归一化到目标高度、底面贴地、水平居中 */
function useGlb(key, targetH){
  const src = GLB[key];
  if(!src) return null;
  const clone = src.clone(true);
  const wrap = new THREE.Group();
  wrap.add(clone);
  const box = new THREE.Box3().setFromObject(clone);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = targetH / Math.max(size.y, 0.0001);
  clone.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(clone);
  clone.position.y -= box2.min.y;
  clone.position.x -= (box2.min.x + box2.max.x) / 2;
  clone.position.z -= (box2.min.z + box2.max.z) / 2;
  clone.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  return wrap;
}
/* 花卉包装：整株作为 stem 参与生长缩放，bloom 用隐形占位（星星提示逻辑照常工作） */
function glbFlower(key, targetH){
  const g = useGlb(key, targetH);
  if(!g) return null;
  const dummy = new THREE.Object3D(); dummy.visible = false;
  g.add(dummy);
  return {group: g, stem: g, bloom: dummy};
}

/* ================= 数据配置 ================= */
const SEEDS = {
  tulip:  { name:'郁金香', ico:'🌷', cost:5,  sell:12, grow:10, lvl:1, build:buildTulip  },
  daisy:  { name:'小雏菊', ico:'🌼', cost:8,  sell:18, grow:16, lvl:2, build:buildDaisy  },
  sun:    { name:'向日葵', ico:'🌻', cost:12, sell:30, grow:22, lvl:3, build:buildSun    },
  rose:   { name:'玫瑰',   ico:'🌹', cost:20, sell:55, grow:30, lvl:4, build:buildRose   },
};
/* 花艺工坊配方（Lv.4 解锁）—— 花材加工后卖价更高，订单更爱收 */
const CRAFTS = {
  tBouquet: { name:'郁金香花束', ico:'💐', need:{tulip:3},          sell:60  },
  mixed:    { name:'野趣混合束', ico:'💐', need:{tulip:1, daisy:2}, sell:78  },
  sBasket:  { name:'向日葵花篮', ico:'🧺', need:{sun:3},            sell:108 },
  rBox:     { name:'玫瑰礼盒',   ico:'🎀', need:{rose:2},           sell:145 },
};
/* 稀有花：不可种植，特殊条件下收获时概率获得（花谱集邮目标） */
const RARES = {
  rainbowRose: { name:'虹彩玫瑰', ico:'🌈', sell:88, hint:'彩虹日收获花田时悄悄出现' },
  moonFlower:  { name:'月光花',   ico:'🌙', sell:66, hint:'只在小岛的夜晚绽放' },
};
const FLOWER_TOTAL = Object.keys(SEEDS).length + Object.keys(RARES).length; /* 花谱总数 6 */
const DECORS = [
  { id:'balloon', name:'气球束',   ico:'🎈', price:40,  build:buildBalloon },
  { id:'fence',   name:'奶油栅栏', ico:'🤍', price:50,  build:buildFence   },
  { id:'lamp',    name:'月光路灯', ico:'🏮', price:60,  build:buildLamp    },
  { id:'bench',   name:'木纹长椅', ico:'🪑', price:70,  build:buildBench   },
  { id:'sakura',  name:'樱花树',   ico:'🌸', price:80,  build:buildSakura  },
  { id:'pond',    name:'小池塘',   ico:'💧', price:120, build:buildPond    },
  { id:'umbrella',name:'遮阳咖啡桌',ico:'⛱️', price:100, build:buildUmbrella},
  { id:'fountain',name:'星光喷泉', ico:'⛲', price:150, build:buildFountain },
  { id:'well',    name:'许愿水井', ico:'🪣', price:200, build:buildWell    },
];

/* ================= 存档 ================= */
const SAVE_KEY = 'cloud-farm-save-v1';
const ISLAND_NAMES = ['奶油云朵岛','樱花气泡岛','薄荷糖浮岛','棉花糖小岛','彩虹牧云岛','晚风花房岛'];
let S = {
  coins: 30,
  xp: 0,
  lvl: 1,
  bag: {},
  plots: Array.from({length:12}, () => ({seed:null, plantedAt:0, watered:false})),
  decor: [],
  orders: [],
  stats: { harvest: 0, kinds: {} },   /* 收获统计 & 花谱（晒卡片用） */
  firstPlay: 0,                       /* 上岛日期 */
  islandName: '',                     /* 小岛名（晒卡片用） */
  daily: { date: '', claimed: false },/* 云端邮差每日礼物 */
};
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.plots) && d.plots.length===12){
      S = Object.assign(S, d);
      S.bag = d.bag || {};
      S.decor = d.decor || [];
    }
  }catch(e){}
}
load();
/* 老存档补齐新字段 */
if(!S.firstPlay) S.firstPlay = Date.now();
if(!S.islandName) S.islandName = ISLAND_NAMES[Math.floor(Math.random()*ISLAND_NAMES.length)];
S.stats = S.stats || { harvest: 0, kinds: {} };
S.stats.kinds = S.stats.kinds || {};
S.daily = S.daily || { date: '', claimed: false };

/* ================= 今日天气（按日期确定，全岛共享） ================= */
const WEATHERS = [
  { id:'sun',       ico:'☀️', name:'晴朗'   },
  { id:'petal',     ico:'🌸', name:'花瓣雨' },
  { id:'butterfly', ico:'🦋', name:'蝴蝶日' },
  { id:'sun',       ico:'☀️', name:'晴朗'   },
  { id:'rainbow',   ico:'🌈', name:'彩虹日' },
];
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function hashStr(str){ let h = 0; for(const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }

const _dc = [new THREE.Color(), new THREE.Color(), new THREE.Color(), new THREE.Color()];
const _hex = c => '#'+c.getHexString();
let dayClock = 0;
function updateDayNight(t, dt){
  dayClock += dt;
  const p = (DAY_START + dayClock/DAY_LEN) % 1;
  let a = DAY_STOPS[0], b = DAY_STOPS[DAY_STOPS.length-1];
  for(let i=0;i<DAY_STOPS.length-1;i++){
    if(p >= DAY_STOPS[i].t && p <= DAY_STOPS[i+1].t){ a = DAY_STOPS[i]; b = DAY_STOPS[i+1]; break; }
  }
  const span = Math.max(1e-6, b.t - a.t);
  const k = Math.min(1, Math.max(0, (p - a.t)/span));
  const e = k*k*(3-2*k); /* smoothstep */
  /* 天空渐变重绘 */
  for(let i=0;i<4;i++) _dc[i].set(a.sky[i]).lerp(_cBHelper(b.sky[i]), e);
  drawSky(_dc.map(_hex));
  skyTex.needsUpdate = true;
  /* 雾 / 灯光 */
  scene.fog.color.set(a.fog).lerp(_cBHelper(b.fog), e);
  sun.color.set(a.sunC).lerp(_cBHelper(b.sunC), e);
  sun.intensity  = a.sunI  + (b.sunI -a.sunI )*e;
  hemi.intensity = a.hemiI + (b.hemiI-a.hemiI)*e;
  rim.intensity  = a.rimI  + (b.rimI -a.rimI )*e;
  DAY.night = a.night + (b.night - a.night)*e;
  DAY.phase = p < 0.46 ? '白天' : p < 0.60 ? '黄昏' : p < 0.93 ? '夜晚' : '破晓';
  DAY.ico = p < 0.46 ? '☀️' : p < 0.60 ? '🌇' : p < 0.93 ? '🌙' : '🌅';
}

/* 不规则圆形轮廓：把圆柱外圈顶点按角度做噪声抖动 */
function jitterEdge(geo, amp1, amp2){
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.hypot(x,z);
    if(r > 0.6){
      const a = Math.atan2(z,x);
      const k = 1 + amp1*Math.sin(a*5+1.7) + amp2*Math.sin(a*9+4.2) + amp1*0.6*Math.sin(a*3+0.5);
      pos.setX(i, x*k); pos.setZ(i, z*k);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

function speckleTex(base, spots, dots, dotsN=0, detail=''){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  for(let i=0;i<22;i++){
    g.fillStyle = spots[Math.floor(Math.random()*spots.length)];
    g.globalAlpha = 0.05 + Math.random()*0.08;
    const rx = 18 + Math.random()*24;
    g.beginPath();
    g.ellipse(Math.random()*256, Math.random()*256, rx, rx*(0.45+Math.random()*0.35), Math.random()*Math.PI, 0, Math.PI*2);
    g.fill();
  }
  for(let i=0;i<420;i++){
    g.fillStyle = spots[Math.floor(Math.random()*spots.length)];
    g.globalAlpha = 0.25 + Math.random()*0.4;
    const s = 1 + Math.random()*2.6;
    g.beginPath();
    g.ellipse(Math.random()*256, Math.random()*256, s, s*(0.4+Math.random()*0.6), Math.random()*3, 0, Math.PI*2);
    g.fill();
  }
  g.globalAlpha = 1;
  for(let i=0;i<dotsN;i++){
    g.fillStyle = dots[Math.floor(Math.random()*dots.length)];
    g.beginPath(); g.arc(Math.random()*256, Math.random()*256, 2.2+Math.random()*1.6, 0, Math.PI*2); g.fill();
  }
  for(let i=0;i<360;i++){
    g.fillStyle = spots[Math.floor(Math.random()*spots.length)];
    g.globalAlpha = 0.1 + Math.random()*0.16;
    g.beginPath(); g.arc(Math.random()*256, Math.random()*256, 0.35+Math.random()*0.75, 0, Math.PI*2); g.fill();
  }
  if(detail === 'grass'){
    for(let i=0;i<28;i++){
      const x = Math.random()*256, y = 8+Math.random()*248;
      const len = 7+Math.random()*10, bend = (Math.random()-0.5)*5;
      g.fillStyle = i%2 ? '#b2e3b7' : '#69ad76';
      g.globalAlpha = 0.2 + Math.random()*0.18;
      g.beginPath();
      g.moveTo(x-0.7,y+2);
      g.quadraticCurveTo(x+bend*0.25,y-len*0.35,x+bend,y-len);
      g.quadraticCurveTo(x+bend*0.1,y-len*0.25,x+0.7,y+2);
      g.closePath(); g.fill();
    }
  } else if(detail === 'soil'){
    for(let i=0;i<16;i++){
      const y = i*16+Math.random()*7;
      g.strokeStyle = i%3 ? '#76543f' : '#b18b6c';
      g.globalAlpha = 0.12 + Math.random()*0.12;
      g.lineWidth = 0.7 + Math.random()*0.9;
      g.beginPath();
      g.moveTo(0,y);
      g.bezierCurveTo(64,y-2,192,y+2,256,y+(Math.random()-0.5)*3);
      g.stroke();
    }
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function grainTex(){

  const g = c.getContext('2d');
  g.fillStyle = '#c49a6c'; g.fillRect(0,0,256,256);

    g.strokeStyle = `rgba(120,80,45,${0.12+Math.random()*0.2})`;
    g.lineWidth = 1 + Math.random()*2.2;
    g.beginPath();
    const y = Math.random()*256;
    g.moveTo(0, y);
    g.bezierCurveTo(80, y+(Math.random()-0.5)*22, 170, y+(Math.random()-0.5)*22, 256, y+(Math.random()-0.5)*18);
    g.stroke();
  }
  for(let i=0;i<14;i++){
    g.fillStyle = `rgba(160,115,70,${0.2+Math.random()*0.25})`;
    g.beginPath();
    g.ellipse(Math.random()*256, Math.random()*256, 4+Math.random()*7, 2+Math.random()*3, Math.random(), 0, Math.PI*2);
    g.fill();
  }
  for(let i=0;i<3;i++){
    const x = 24+Math.random()*208, y = 24+Math.random()*208, rot = (Math.random()-0.5)*0.5;
    for(let ring=0;ring<3;ring++){
      g.strokeStyle = `rgba(112,72,40,${0.32-ring*0.06})`;

      g.beginPath();
      g.ellipse(x,y,3.5+ring*3.3,1.8+ring*1.8,rot,0,Math.PI*2);
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function swapVegetation(){
  if(!GLB.bush_flower && !GLB.hedge) return;
  bushGroup.clear();
  const n = 14;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2 + Math.random()*0.4;
    const r = 3.6 + Math.random()*2.9;
    /* 避开装饰位 */
    let clash = false;
    for(const sp of DECOR_SPOTS){
      if(Math.hypot(Math.cos(a)*r - sp.x, Math.sin(a)*r - sp.z) < 1.5) clash = true;
    }
    if(clash) continue;
    const wantHedge = (i%4===0) && GLB.hedge;
    const key = wantHedge ? 'hedge' : (GLB.bush_flower ? 'bush_flower' : (GLB.hedge ? 'hedge' : null));
    if(!key) continue;

const GRASS_TIME = {value:0};
{

    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       float gph = float(gl_InstanceID) * 1.73;
       float sway = smoothstep(0.04, 0.4, transformed.y);
       transformed.x += sin(uTime*2.2 + gph) * 0.11 * sway;
       transformed.z += cos(uTime*1.7 + gph*1.3) * 0.08 * sway;`);
  };
  const N = 300;
  const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let placed = 0;
  while(placed < N){
    const a = Math.random()*Math.PI*2;
    const r = 3.35 + Math.random()*3.4;
    const sc = 0.7 + Math.random()*0.8;
    e.set(0, Math.random()*Math.PI*2, (Math.random()-0.5)*0.25);

    p.set(Math.cos(a)*r, 0.55, Math.sin(a)*r);
    m4.compose(p, q, s);

    placed++;
  }

}

/* Quaternius 写实深色 → 马卡龙治愈系重映射 */
function recolorCharacterMaterial(m){
  if(!m || !m.color) return m;
  const hsl = {}; m.color.getHSL(hsl);
  let target;
  if(hsl.l < 0.18 && (hsl.h > 0.85 || hsl.h < 0.1)){
    target = new THREE.Color(0x8a5a3a);                    /* 酒红头发 → 栗棕 */
  } else if(hsl.h > 0.22 && hsl.h < 0.58){
    target = new THREE.Color(0xffc9d9);                    /* 深绿/杂色衣 → 樱花粉 */
  } else if(hsl.l < 0.3){
    target = new THREE.Color(0xfff3e6);                    /* 其余深色 → 奶油白 */
  } else {
    target = m.color.clone().lerp(new THREE.Color(0xfff6ec), 0.55);  /* 提亮偏暖 */
  }
  return new THREE.MeshToonMaterial({
    color: target, map: m.map || null, gradientMap: TOON_RAMP,
    transparent: !!m.transparent, alphaTest: m.alphaTest || 0,
  });
}

  const model = SkeletonUtils.clone(GLB.farmer);
  /* 重烘焙蒙皮：Quaternius 这批 GLB 的 inverseBindMatrices 与骨骼空间不一致
     （网格渲染位置偏离骨骼 2~4 单位且随姿势漂移 → 碎三角形/隐形）。
     把每根骨骼的 boneInverse 重算为 boneWorld_bind⁻¹ × M（M = 该网格节点链 matrixWorld，
     即作者意图的摆放），使 bind 姿势渲染 = M × v，动画则正确地围绕它变形。 */
  model.updateMatrixWorld(true);
  model.traverse(o=>{
    if(!o.isSkinnedMesh) return;
    const M = o.matrixWorld.clone();
    const inv = new THREE.Matrix4();
    const sk = o.skeleton;
    for(let i = 0; i < sk.bones.length; i++){
      inv.copy(sk.bones[i].matrixWorld).invert();
      sk.boneInverses[i].multiplyMatrices(inv, M);
    }
  });
  /* 蒙皮感知包围盒：采样蒙皮后的真实渲染范围（此刻为重烘焙后的 bind 姿势） */
  model.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const v = new THREE.Vector3();
  model.traverse(o=>{
    if(!o.isSkinnedMesh) return;
    const pos = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(pos.count / 96));
    for(let i=0;i<pos.count;i+=step){
      v.fromBufferAttribute(pos, i);
      o.applyBoneTransform(i, v);
      v.applyMatrix4(o.matrixWorld);
      box.expandByPoint(v);
    }
  });
  if(box.isEmpty()) box.setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = 1.5 / Math.max(size.y, 0.0001);
  /* 归一化：总高约 1.5，底面贴地、水平居中。
     缩放放在外层 wrap（蒙皮安全），model 自身保持 scale=1 不动骨骼矩阵。 */
  const wrap = new THREE.Group();
  wrap.scale.setScalar(s);
  wrap.add(model);
  model.position.y -= box.min.y;
  model.position.x -= (box.min.x + box.max.x) / 2;
  model.position.z -= (box.min.z + box.max.z) / 2;
  model.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true; o.frustumCulled = false;
      /* 马卡龙调色 + Toon 化（保留贴图若有） */
      o.material = Array.isArray(o.material)
        ? o.material.map(recolorCharacterMaterial)
        : recolorCharacterMaterial(o.material);
    }
  });
  const mixer = new THREE.AnimationMixer(model);
  const actions = {};
  for(const clip of GLB_ANIMS.farmer){
    actions[clip.name] = mixer.clipAction(clip);
  }
  FGLB.mixer = mixer;
  FGLB.actions = actions;
  FGLB.cur = null;
  return wrap;
}
function setAct(name, once){
  const A = FGLB.actions;
  if(!A || !A[name]) return;
  if(FGLB.cur === name && !once) return;
  if(FGLB.cur === name && once) return;   /* 一次性动作不重复触发 */
  const prev = A[FGLB.cur];
  if(prev) prev.fadeOut(0.18);
  const a = A[name];
  a.reset();
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = !!once;
  a.fadeIn(0.18).play();
  FGLB.cur = name;
}
function swapFarmer(){
  const w = buildFarmerGLB();
  if(!w) return;
  w.position.copy(farmer.root.position);
  w.position.y = 0.55;
  w.rotation.y = farmer.root.rotation.y;
  farmer.root.visible = false;
  scene.add(w);
  farmerRoot = w;
  FGLB.wrap = w;
}
function farmerTask(i, kind){
  FSTATE.plotI = i; FSTATE.kind = kind; FSTATE.mode = 'walking'; FSTATE.actPlayed = false;
  const p = plots[i];
  let dx = p.x*0.72, dz = p.z - 1.5;
  const d = Math.hypot(dx, dz);
  if(d > 6.2){ dx *= 6.2/d; dz *= 6.2/d; }
  FSTATE.tx = dx; FSTATE.tz = dz;
}
function farmerWaterDrop(){
  const r = farmerRoot;
  const v = new THREE.Vector3();
  if(FGLB.wrap){
    const fwd = new THREE.Vector3(Math.sin(r.rotation.y), 0, Math.cos(r.rotation.y));
    v.copy(r.position).add(fwd.multiplyScalar(0.45));
    v.y += 0.85;
  } else {
    farmer.spout.getWorldPosition(v);
  }
  const p = plots[FSTATE.plotI];
  const dir = new THREE.Vector3(p.x - v.x, 0.2, p.z - v.z).normalize().multiplyScalar(1.1);
  dir.y = -0.5;
  const g = new THREE.Group();
  const dropGeo = new THREE.SphereGeometry(0.038,5,4);
  const dropMat = new THREE.MeshBasicMaterial({color:0x9fdcff, transparent:true});
  for(let i=0;i<3;i++){
    const m = new THREE.Mesh(dropGeo, dropMat), side = i-1;
    m.position.copy(v);
    m.position.x += Math.cos(r.rotation.y)*side*0.035;
    m.position.z -= Math.sin(r.rotation.y)*side*0.035;
    const vel = dir.clone();
    vel.x += side*0.12;
    vel.z -= side*0.08;
    vel.y += i===1 ? 0.12 : 0;
    m.userData = {v:vel};
    g.add(m);
  }
  const mist = new THREE.Mesh(new THREE.SphereGeometry(0.085,6,5),
    new THREE.MeshBasicMaterial({color:0xdff5ff, transparent:true, opacity:0.18, depthWrite:false}));
  mist.position.copy(v).addScaledVector(dir,0.04);
  mist.userData = {v:dir.clone().multiplyScalar(0.65), opacity:0.18};
  g.add(mist);
  scene.add(g);
  fxList.push({group:g, t:0, life:0.6});
}
function farmerTick(dt){
  const f = FSTATE, r = farmerRoot;
  const glb = !!FGLB.mixer;
  if(glb) FGLB.mixer.update(dt);
  else {
    /* 眨眼（仅程序农夫） */
    f.blinkT -= dt;
    if(f.blinkT <= 0){
      farmer.face.scale.y = 0.12;
      if(f.blinkT < -0.13){ farmer.face.scale.y = 1; f.blinkT = 2.2 + Math.random()*2.5; }
    }
  }
  if(f.mode === 'walking'){
    const dx = f.tx - r.position.x, dz = f.tz - r.position.z;
    const d = Math.hypot(dx, dz);
    r.rotation.y += (Math.atan2(dx, dz) - r.rotation.y)*0.2;
    if(d < 0.08){ f.mode = 'acting'; f.t = 0; f.dropT = 0; f.actPlayed = false; }
    else {
      const sp = Math.min(2.6*dt, d);
      r.position.x += dx/d*sp; r.position.z += dz/d*sp;
      if(glb){
        r.position.y = 0.55;
        setAct('CharacterArmature|Walk');
        const wa = FGLB.actions['CharacterArmature|Walk'];
        if(wa) wa.timeScale = 2.1;
      } else {
        const wt = performance.now()*0.012;
        r.position.y = 0.55 + Math.abs(Math.sin(wt))*0.09;
        farmer.armL.rotation.x = Math.sin(wt)*0.55;
        farmer.armR.rotation.x = -Math.sin(wt)*0.2;
        r.rotation.x = 0.06;
      }
    }
  } else if(f.mode === 'acting'){
    f.t += dt;
    if(glb){
      if(!f.actPlayed){ setAct('CharacterArmature|Interact', true); f.actPlayed = true; }
    }
    if(f.kind === 'water'){
      if(!glb){
        farmer.armR.rotation.x = -1.05 + Math.sin(f.t*9)*0.07;
        farmer.can.rotation.x = 0.5;
      }
      f.dropT -= dt;
      if(f.dropT <= 0){ f.dropT = 0.07; farmerWaterDrop(); }
      const dur = glb ? 1.35 : 1.15;
      if(f.t > dur){
        f.mode = 'idle';
        if(!glb){ farmer.can.rotation.x = 0; farmer.armR.rotation.x = 0; }
        r.rotation.x = 0; r.position.y = 0.55;
      }
    } else if(f.kind === 'harvest'){
      if(!glb){
        r.position.y = 0.55 + Math.abs(Math.sin(f.t*7))*0.28;
        farmer.armL.rotation.x = -1.7*Math.min(1, f.t*3);
      }
      if(f.t > 0.8){
        f.mode = 'idle';
        if(!glb){ farmer.armL.rotation.x = 0; }
        r.position.y = 0.55;
      }
    } else {
      if(!glb){
        const k = Math.sin(Math.min(1, f.t/0.8)*Math.PI);
        r.scale.y = FSCALE*(1 - k*0.18);
        farmer.armL.rotation.x = -k*0.9; farmer.armR.rotation.x = -k*0.9;
      }
      if(f.t > 0.85){
        f.mode = 'idle';
        if(!glb){ r.scale.y = FSCALE; farmer.armL.rotation.x = 0; farmer.armR.rotation.x = 0; }
      }
    }
  } else {
    /* 待机呼吸 */
    if(glb){
      setAct('CharacterArmature|Idle');
      r.position.y = 0.55;
      r.rotation.x = 0;
    } else {
      r.position.y = 0.55 + Math.sin(performance.now()*0.0022)*0.015;
      r.rotation.x *= 0.9;
    }
  }
}

function flowerBase(h){
  const group = new THREE.Group();
  const stem = mesh(new THREE.CylinderGeometry(0.055,0.075,h,6), MATS.stem, 0,h/2,0);

  const l1 = mesh(leafGeo, MATS.leaf, 0.2,h*0.45,0);  l1.scale.set(1.4,0.4,0.7); l1.rotation.z = -0.5;
  const l2 = mesh(leafGeo, MATS.leaf, -0.2,h*0.3,0);  l2.scale.set(1.4,0.4,0.7); l2.rotation.z = 0.5;
  stem.add(l1,l2);

}

/* ================= 音效（WebAudio 合成，零素材） ================= */
let AC = null, muted = false;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type='sine', vol=0.14, slide=0){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, a.currentTime + t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), a.currentTime + t0 + dur);
  g.gain.setValueAtTime(0, a.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.05);
}
const SFX = {
  plant:  ()=>{ tone(520,0,0.09,'sine',0.12); tone(780,0.08,0.12,'sine',0.1); },
  water:  ()=> tone(320,0,0.28,'sine',0.1,-160),
  harvest:()=> [660,880,1174].forEach((f,i)=>tone(f,i*0.06,0.13,'triangle',0.11)),
  mutate: ()=> [1318,1760,2217].forEach((f,i)=>tone(f,i*0.07,0.16,'sine',0.1)),
  coin:   ()=> [880,1318].forEach((f,i)=>tone(f,i*0.07,0.1,'square',0.05)),
  buy:    ()=> [523,659,784,1046].forEach((f,i)=>tone(f,i*0.05,0.11,'triangle',0.09)),
  levelup:()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,i*0.09,0.2,'triangle',0.11)),
  error:  ()=> tone(220,0,0.16,'sawtooth',0.05,-60),
};
function sfx(n){ if(!muted) try{ SFX[n](); }catch(e){} }

/* ================= BGM（实时合成：和弦垫 + 风铃旋律） ================= */
const CHORDS = [
  [261.6, 329.6, 392.0],
  [220.0, 261.6, 329.6],
  [174.6, 220.0, 261.6],
  [196.0, 246.9, 293.7],
];
const MELO = [523.3, 587.3, 659.3, 784.0, 880.0, 1046.5];
let bgmNext = 0, bgmChord = 0, bgmOn = false;
function padNote(f, t, dur, vol){
  const a = ac(); if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.5);
  g.gain.setValueAtTime(vol, t + dur - 0.6);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur);
}
function bellNote(f, t){
  const a = ac(); if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 1.5);
}
function startBGM(){
  if(bgmOn) return; bgmOn = true;
  const a = ac(); if(!a) return;
  bgmNext = a.currentTime + 0.15;
  setInterval(()=>{
    const a2 = ac(); if(!a2 || muted) return;
    while(bgmNext < a2.currentTime + 1.2){
      const ch = CHORDS[bgmChord % CHORDS.length];
      ch.forEach((f,i)=> padNote(f, bgmNext, 2.5, i===0 ? 0.03 : 0.022));
      if(Math.random() < 0.72) bellNote(MELO[Math.floor(Math.random()*MELO.length)], bgmNext + Math.random()*1.4);
      bgmNext += 2.5; bgmChord++;
    }
  }, 350);
}

function plant(i, seedId, free=false){
  const seed = SEEDS[seedId];
  if(S.lvl < (seed.lvl||1)){ sfx('error'); toast('Lv.'+seed.lvl+' 解锁哦，先攒经验吧'); return; }
  if(!free && S.coins < seed.cost){ sfx('error'); toast('金币不够啦 🥺'); return; }
  if(!free) S.coins -= seed.cost;
  S.plots[i] = {seed:seedId, plantedAt:Date.now(), watered:false};
  rebuildPlot(i);
  sfx('plant');
  farmerTask(i,'plant');
  save(); refreshHUD(); hideModal();
  hintEl.classList.add('fade');

function plotProgress(i){
  const p = S.plots[i];
  if(!p.seed) return 0;
  const dur = SEEDS[p.seed].grow*1000 * (p.watered?0.62:1);
  return Math.min(1, (Date.now()-p.plantedAt)/dur);
}
function isReady(i){ return S.plots[i].seed && plotProgress(i) >= 1; }

function water(i){
  if(S.plots[i].watered || isReady(i)) return;
  const p = S.plots[i];
  const now = Date.now();
  const oldDur = SEEDS[p.seed].grow*1000;
  const oldP = Math.min(1,(now-p.plantedAt)/oldDur);
  const newDur = oldDur*0.62;
  p.plantedAt = now - oldP*newDur;
  p.watered = true;
  const plot = plots[i];
  dropSplash(new THREE.Vector3(plot.x, 1.2, plot.z));
  sfx('water');
  farmerTask(i,'water');
  toast('浇水啦～ 长得更快哦 💧');
  save();
}
function harvestFix(i){

  floatText('+'+got+' '+SEEDS[seedId].ico, plots[i].x, 2.1, plots[i].z, mutate ? '#ff8fa9' : '#ffb748');
  S.stats.harvest = (S.stats.harvest||0) + got;          /* 收获计数（晒卡片用） */
  (S.stats.kinds = S.stats.kinds || {})[seedId] = true;  /* 花谱集邮 */
  /* 稀有花：虹彩玫瑰（彩虹日 15%）/ 月光花（夜晚 12%） */
  let rareGot = null;
  if(WEATHER.id === 'rainbow' && Math.random() < 0.15) rareGot = 'rainbowRose';
  else if(DAY.night > 0.6 && Math.random() < 0.12) rareGot = 'moonFlower';
  if(rareGot){

    sparkle(new THREE.Vector3(plots[i].x, 2.4, plots[i].z), rareGot === 'rainbowRose' ? 0xc9b6ff : 0xa9d3ff, 22);
    toast('✨ 稀有！发现 '+RARES[rareGot].ico+' '+RARES[rareGot].name+'！');
    sfx('mutate');
  }
  sparkle(new THREE.Vector3(plots[i].x, 1.7, plots[i].z), mutate ? 0xffd24a : 0xffe9a1);
  if(mutate) sparkle(new THREE.Vector3(plots[i].x, 2.2, plots[i].z), 0xfff3b0, 10);
  addXp(2);
  S.plots[i].seed = null; S.plots[i].plantedAt = 0; S.plots[i].watered = false;

  sfx(mutate ? 'mutate' : 'harvest');

}

/* --- 田地可视 --- */
function rebuildPlot(i){
  const plot = plots[i];
  const p = S.plots[i];
  plot.soil.material = p.seed ? plotMats.planted : plotMats.empty;
  if(plot.plant){
    plotGroup.remove(plot.plant.group);
    plot.plant = null;
  }
  if(p.seed){
    const built = SEEDS[p.seed].build();
    built.group.position.set(plot.x, 1.0, plot.z);
    built.group.rotation.y = Math.random()*Math.PI*2;
    built.group.scale.setScalar(0.9 + Math.random()*0.2);
    plotGroup.add(built.group);
    const gem = new THREE.Sprite(new THREE.SpriteMaterial({
      map:STAR_TEX, color:0xffe27a, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    gem.scale.setScalar(0.55);
    gem.visible = false;
    built.group.add(gem);
    built.gem = gem;
    built.phase = Math.random()*Math.PI*2;
    plot.plant = built;
  }
}
function perf(){ return performance.now()/1000; }
function refreshPlots(){
  for(let i=0;i<12;i++){
    const plot = plots[i], p = S.plots[i];
    if(!plot.plant) continue;
    const prog = plotProgress(i);
    const plant = plot.plant;
    plant.stem.scale.y = Math.max(0.12, Math.min(1, prog*1.25));
    const bScale = Math.max(0.0001, Math.min(1, (prog-0.45)/0.55));
    plant.bloom.visible = prog > 0.45;
    plant.bloom.scale.setScalar(bScale * (isReady(i) ? 1 + Math.sin(perf()*3+plant.phase)*0.04 : 1));
    const ready = isReady(i);
    plant.gem.visible = ready;
    if(ready){
      const gl = 0.45 + Math.sin(perf()*3+plant.phase)*0.1;
      plant.gem.scale.setScalar(gl);
      plant.gem.position.y = 1.95 + Math.sin(perf()*2.5+plant.phase)*0.12;
    }
    plant.group.rotation.z = Math.sin(perf()*1.8 + plant.phase) * 0.05 * Math.min(1, prog*2);
  }
}

function genOrder(){
  const pool = unlockedSeedIds().map(id=>({id, sell:SEEDS[id].sell, max:3}));
  if(S.lvl >= 4) for(const [id,c] of Object.entries(CRAFTS)) pool.push({id, sell:c.sell, max:1});
  const types = 1 + (Math.random()<0.6?1:0) + (S.lvl>=3 && Math.random()<0.35?1:0);
  const picked = [];
  for(let k=0;k<types;k++){
    const it = pool[Math.floor(Math.random()*pool.length)];
    const qty = 1 + Math.floor(Math.random()*it.max);
    const found = picked.find(p=>p.id===it.id);
    if(found) found.n = Math.min(it.max, found.n+qty);
    else picked.push({id:it.id, n:qty});
  }
  let coins = 0, items = 0;
  const need = {};
  for(const p of picked){
    need[p.id] = p.n; items += p.n;
    coins += srcOf(p.id).sell * p.n;
  }
  coins = Math.round(coins * 1.35);
  return {need, coins, xp: 4*items + 3*picked.length};
}
function renderOrders(){
  let html = '<div class="sectionTip">小镇客人的心愿单～完成可得溢价报酬和经验</div>';
  S.orders.forEach((o,i)=>{
    const ok = orderDeliverable(o);
    const items = Object.entries(o.need).map(([id,n])=>{
      const s = srcOf(id); return s.ico+'×'+n;
    }).join(' ＋ ');
    const haveTxt = Object.entries(o.need).map(([id,n])=>{
      const s = srcOf(id); const have = S.bag[id]||0;
      return `<span style="color:${have>=n?'#7cb88a':'#c98a8a'}">${s.name} ${Math.min(have,n)}/${n}</span>`;
    }).join('、');
    html += `<div class="row">
      <div class="ico">💌</div>
      <div class="info"><div class="nm">${items}</div>
        <div class="sub">${haveTxt} · 报酬 ${o.coins}🪙 +${o.xp}⭐</div></div>
      <button class="${ok?'sell':'off'}" data-order="${i}">${ok?'交付':'未齐'}</button>
    </div>`;
  });
  showModal('📋 小镇订单', html);
  mBody.querySelectorAll('[data-order]').forEach(b=>{
    b.addEventListener('click', ()=>deliverOrder(+b.dataset.order));
  });
}
function deliverOrder(i){
  const o = S.orders[i];
  if(!orderDeliverable(o)){ sfx('error'); toast('材料还没凑齐哦'); return; }
  for(const [id,n] of Object.entries(o.need)){ S.bag[id]-=n; if(S.bag[id]<=0) delete S.bag[id]; }
  S.coins += o.coins;
  addXp(o.xp);
  sparkle(new THREE.Vector3(0,2,0), 0xffe9a1, 26);
  floatText('+'+o.coins+' 🪙', 0, 2.4, 0);
  sfx('coin');
  toast('订单完成！+'+o.coins+'🪙 +'+o.xp+'⭐');
  S.orders[i] = genOrder();
  save(); refreshHUD(); renderOrders();
}

function openDecor(){
  const sc = islandScore();
  const stars = '✨'.repeat(sc.stars) + '☆'.repeat(5-sc.stars);
  let html = `<div class="sectionTip">小岛颜值 ${stars}（花谱/稀有花/装饰都会加分）· 剩余空位 ${DECOR_SPOTS.length - S.decor.length}</div>`;
  const spotsUsed = S.decor.map(d=>d.spot);
  const free = DECOR_SPOTS.length - spotsUsed.length;
  for(const d of DECORS){
    const owned = S.decor.filter(x=>x.id===d.id).length;
    const can = S.coins >= d.price && free > 0;
    html += `<div class="row">
      <div class="ico">${d.ico}</div>
      <div class="info"><div class="nm">${d.name}${owned?` ×${owned}`:''}</div>
        <div class="sub">${d.price}🪙${free>0?' · 剩余空位 '+free:' · 空位已满'}</div></div>
      <button class="${can?'buy':'off'}" data-decor="${d.id}">${free>0?(can?'买入':'金币不足'):'已满'}</button>
    </div>`;
  }
  showModal('🎀 打扮小岛', html);
  mBody.querySelectorAll('[data-decor]').forEach(b=>{
    b.addEventListener('click', ()=>buyDecor(b.dataset.decor));
  });
}
function buyDecor(id){
  const d = DECORS.find(x=>x.id===id);
  if(S.coins < d.price){ toast('金币不够啦 🥺'); return; }
  const used = new Set(S.decor.map(x=>x.spot));
  let spot = -1;
  for(let i=0;i<DECOR_SPOTS.length;i++){ if(!used.has(i)){ spot = i; break; } }
  if(spot < 0){ toast('装饰位满啦，已经很漂亮了 🌷'); return; }
  S.coins -= d.price;
  S.decor.push({id, spot});
  rebuildDecor(spot);
  sparkle(new THREE.Vector3(DECOR_SPOTS[spot].x, 1.4, DECOR_SPOTS[spot].z), 0xffc9de, 20);
  sfx('buy');
  toast(d.name + ' 入驻小岛！💗');
  save(); refreshHUD(); openDecor();
}
function rebuildDecor(spot){
  const d = S.decor.find(x=>x.spot===spot);
  if(!d) return;
  const item = DECORS.find(x=>x.id===d.id);
  const g = item.build();
  const p = DECOR_SPOTS[spot];
  g.position.set(p.x, 0.5, p.z);
  g.rotation.y = p.ry;
  g.userData.spot = spot;
  g.name = 'decor'+spot;
  const old = decorRoot.getObjectByName('decor'+spot);
  if(old) decorRoot.remove(old);
  decorRoot.add(g);
}

/* ---- 小岛卡片（1080×1440 小红书竖版分享卡） ---- */
const GAME_URL = 'https://xiamixiao64.github.io/yunshang-xiaotian/';
function buildIslandCard(){
  const W = 1080, H = 1440;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  /* 奶油底 + 马卡龙柔光斑 */
  g.fillStyle = '#fff6ec'; g.fillRect(0,0,W,H);
  for(const [col,x,y,r] of [['#ffc9d9',260,220,180],['#8ccf95',880,300,150],['#7fbef5',180,1240,160],['#ffe3a1',900,1180,140],['#ffc9d9',540,70,120]]){
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0, col+'55'); rg.addColorStop(1, col+'00');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  /* 角落手绘小花 */
  const flower = (x,y,s,col)=>{
    g.fillStyle = col;
    for(let i=0;i<5;i++){
      const a = i*Math.PI*2/5 - Math.PI/2;
      g.beginPath(); g.ellipse(x+Math.cos(a)*s*0.6, y+Math.sin(a)*s*0.6, s*0.42, s*0.28, a, 0, Math.PI*2); g.fill();
    }
    g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(x,y,s*0.24,0,Math.PI*2); g.fill();
  };
  flower(115,168,26,'#ffc9d9'); flower(955,212,22,'#a9d3ff'); flower(102,1192,22,'#a8e6a3'); flower(962,1238,26,'#ffb7c9');
  /* 标题区 */
  g.textAlign = 'center';
  g.fillStyle = '#8a5a3a';
  g.font = '900 58px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('☁️ '+S.islandName, W/2, 118);
  g.font = '400 26px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#b09a8a';
  g.fillText('云上小田 · '+(SEASON.ico ? SEASON.ico+SEASON.name+' · ' : '')+WEATHER.ico+' '+WEATHER.name+' · '+DAY.ico+' '+DAY.phase+' · '+TODAY, W/2, 160);
  /* 游戏截图：圆角白框 */
  const rr = (x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
  const bx = 80, by = 205, bw = W-160, bh = 850;
  g.save(); rr(bx,by,bw,bh,28); g.clip();
  g.fillStyle = '#cfe6f7'; g.fillRect(bx,by,bw,bh);
  const src = renderer.domElement;
  const sr = src.width/src.height, br = bw/bh;
  let sw, sh, sx, sy;
  if(sr > br){ sh = src.height; sw = sh*br; sx = (src.width-sw)/2; sy = 0; }
  else { sw = src.width; sh = sw/br; sx = 0; sy = (src.height-sh)/2; }
  g.drawImage(src, sx, sy, sw, sh, bx, by, bw, bh);
  g.restore();
  g.lineWidth = 10; g.strokeStyle = 'rgba(255,255,255,.95)';
  rr(bx,by,bw,bh,28); g.stroke();
  /* 数据胶囊 */
  const kinds = Object.keys(S.stats.kinds||{}).length;
  const days = Math.max(1, Math.ceil((Date.now()-(S.firstPlay||Date.now()))/86400000));
  const chips = ['⭐ Lv.'+S.lvl, '🪙 '+Math.round(S.coins), '🌷 花谱 '+kinds+'/'+FLOWER_TOTAL, '🌻 收获 '+S.stats.harvest];
  const cw = 236, chh = 62, gap = 16;
  let cx0 = (W - (chips.length*cw + (chips.length-1)*gap))/2;
  for(const chip of chips){
    const y = 1120;
    rr(cx0, y, cw, chh, chh/2);
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
    g.lineWidth = 2.5; g.strokeStyle = '#ffd9e4'; g.stroke();
    g.fillStyle = '#8a5a3a';
    g.font = '600 30px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(chip, cx0+cw/2, y+chh/2+10);
    cx0 += cw+gap;
  }
  /* 稀有花标记 */
  const rareOwned = ['rainbowRose','moonFlower'].filter(r=>S.stats.kinds && S.stats.kinds[r]);
  if(rareOwned.length){
    g.font = '600 30px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = '#b08ad8';
    g.fillText('✨ 已遇稀有：'+rareOwned.map(r=>RARES[r].ico+RARES[r].name).join('、'), W/2, 1225);
  }
  /* 主文案 + 颜值星级 */
  const sc = islandScore();
  g.fillStyle = '#8a5a3a';
  g.font = '900 46px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('在云端种花的第 '+days+' 天', W/2, 1285);
  g.font = '600 34px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#e8a0b8';
  g.fillText('✨'.repeat(sc.stars)+'☆'.repeat(5-sc.stars)+' 小岛颜值', W/2, 1335);
  g.font = '400 24px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#c4a998';
  g.fillText('治愈系云端小岛 · 来和我一起种花吧', W/2, 1382);
  /* 右下角扫码入口 */
  try {
    const qrDiv = document.createElement('div');
    new QRCode(qrDiv, { text: GAME_URL, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    const qrCv = qrDiv.querySelector('canvas');
    if(qrCv){
      g.fillStyle = 'rgba(255,255,255,.95)';
      rr(W-196, H-252, 184, 226, 20); g.fill();
      g.lineWidth = 3; g.strokeStyle = '#ffd9e4'; rr(W-196, H-252, 184, 226, 20); g.stroke();
      g.drawImage(qrCv, W-180, H-238, 152, 152);
      g.fillStyle = '#8a5a3a';
      g.font = '700 24px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('扫码来玩', W-104, H-58);
    }
  } catch(e){ /* QR 库缺失时静默跳过 */ }
  return c.toDataURL('image/png');
}

/* 指针：点击 vs 拖拽 */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let downInfo = null;
canvas.addEventListener('pointerdown', e=>{
  downInfo = {x:e.clientX, y:e.clientY, t:Date.now(), moved:0};
});
canvas.addEventListener('pointermove', e=>{
  if(!downInfo) return;
  downInfo.moved = Math.max(downInfo.moved,
    Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y));
  if(downInfo.moved > 6){
    const dx = e.movementX || 0;
    camRig.theta = Math.max(-0.55, Math.min(0.55, camRig.theta - dx*0.004));
    updateCamera();
  }
});
canvas.addEventListener('pointerup', e=>{
  if(downInfo && downInfo.moved <= 6 && Date.now()-downInfo.t < 600){
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX-rect.left, py = e.clientY-rect.top;
    pointerNDC.set((px/rect.width)*2-1, -(py/rect.height)*2+1);
    raycaster.setFromCamera(pointerNDC, camera);
    if(raycaster.intersectObject(visitor, true).length){
      claimDaily();
    } else {
      /* 屏幕空间最近田块拾取：修复前排隐形碰撞箱挡住后排（原先只有前 4 块田可点） */
      let best = -1, bestD = 1e9;
      const v = new THREE.Vector3();
      for(let i=0;i<12;i++){
        v.set(plots[i].x, 1.1, plots[i].z).project(camera);
        const sx = (v.x+1)/2*rect.width, sy = (1-v.y)/2*rect.height;
        const d = Math.hypot(sx-px, sy-py);
        if(d < bestD){ bestD = d; best = i; }
      }
      if(best >= 0 && bestD <= Math.min(rect.width, rect.height)*0.08) onTapPlot(best);
    }
  }
  downInfo = null;
});
canvas.addEventListener('pointercancel', ()=>{ downInfo = null; });

/* ================= 小岛颜值分（装扮驱动 + 晒图资本） ================= */
function islandScore(){
  const kinds = Object.keys(S.stats.kinds||{}).length;
  const rares = ['rainbowRose','moonFlower'].filter(r=>S.stats.kinds && S.stats.kinds[r]).length;
  const raw = S.decor.length*1.2 + kinds*1.5 + rares*3 + Math.min(S.lvl,10)*0.8;
  const stars = Math.max(1, Math.min(5, Math.round(raw/6.5)));
  return { stars, raw };
}

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = perf();
  const dt = Math.min(0.05, clock.getDelta());

  world.position.y = Math.sin(t*0.8)*0.16;

  /* 昼夜循环 */
  updateDayNight(t, dt);

  /* 开场运镜：高空绕岛收进主视角 */
  if(intro){
    intro.t += dt;
    const k = Math.min(1, intro.t/intro.dur);
    const e = 1 - Math.pow(1-k, 3); /* easeOutCubic */
    camRig.theta  = -1.5*(1-e);
    camRig.radius = 32 - 12.5*e;
    camRig.height = 22 - 10.4*e;
    camRig.target.set(0, 3.2 - 2.6*e, 0);
    if(k >= 1){ intro = null; camRig.target.set(0, 0.6, 0); }
    updateCamera();
  }

  /* 云端邮差漂浮 & 叹号闪烁 */
  if(visitor){
    visitor.position.y = visitor.userData.baseY + Math.sin(t*1.1 + visitor.userData.ph)*0.28;
    visitor.rotation.y += dt*0.25;
    const mk = visitor.userData.mark;
    if(mk && mk.visible){
      mk.position.y = 1.95 + Math.sin(t*3)*0.12;
      mk.material.opacity = 0.55 + Math.abs(Math.sin(t*2.4))*0.45;
    }
  }

  /* 新手引导小手 */
  updateGuide();

  WATER_TIME.value = t; GRASS_TIME.value = t;
  farmerTick(dt);
  for(const mo of motes){
    mo.m.position.y += mo.sp*dt;
    mo.m.position.x += Math.sin(t*0.7 + mo.ph)*dt*0.12;
    if(mo.m.position.y > 4.6) mo.m.position.y = 0.7;
    mo.m.material.opacity = (0.22 + DAY.night*0.55) + Math.sin(t*1.3 + mo.ph)*0.2;
  }

  for(const c of clouds){
    const a = Math.atan2(c.position.z, c.position.x) + c.userData.speed*dt/c.userData.r;
    c.position.x = Math.cos(a)*c.userData.r;
    c.position.z = Math.sin(a)*c.userData.r;
  }
  for(const rock of rocks){
    const u = rock.userData;
    const a = u.a + t*0.06;
    rock.position.set(Math.cos(a)*u.r, u.y + Math.sin(t*0.9+u.bob)*0.3, Math.sin(a)*u.r);
    rock.rotation.y += dt*0.3;
  }
  for(const b of butterflies){
    const u = b.userData;
    const a = t*u.speed + u.phase;
    b.position.set(u.cx + Math.cos(a)*u.r, u.h + Math.sin(t*2.3+u.phase)*0.28, u.cz + Math.sin(a)*u.r);
    b.rotation.y = -a + Math.PI/2;
    const flap = 0.3 + Math.abs(Math.sin(t*13+u.phase))*0.95;
    u.wl.rotation.z = flap;
    u.wr.rotation.z = -flap;
  }
  for(const p of petals){
    const u = p.userData;
    if(u.land > 0){
      p.material.opacity = Math.max(0,p.material.opacity-dt*1.1);
      if(p.material.opacity <= 0) resetPetal(p);
      continue;
    }
    u.a += u.speed*dt;
    p.position.x = Math.cos(u.a)*u.r;
    p.position.z = Math.sin(u.a)*u.r;
    p.position.y -= u.fall*dt;
    p.rotation.x += (1.1+u.flip)*dt;
    p.rotation.y += dt*0.55;
    p.rotation.z = Math.sin(t*0.9+u.a)*0.5;
    p.material.opacity = Math.min(0.82,p.material.opacity+dt*0.8);
    const ground = world.position.y+0.59;
    if(p.position.y <= ground){
      p.position.y = ground;
      u.land = 0.001;
    }
  }

  /* 冬季雪花飘落 */
  for(const s of snowflakes){
    const u = s.userData;
    s.position.y -= u.vy*dt;
    s.position.x += Math.sin(t*0.8 + u.ph)*u.sway*dt;
    s.rotation.x += dt*0.6;
    if(s.position.y < 0.2){
      s.position.y = 11 + Math.random()*3;
      const a = Math.random()*Math.PI*2, r = Math.random()*11;
      s.position.x = Math.cos(a)*r; s.position.z = Math.sin(a)*r;
    }
  }
  /* 月亮 & 星空随夜晚浮现 */
  moon.material.opacity = DAY.night*0.95;
  for(const st of skyStars){
    st.s.material.opacity = DAY.night * (0.25 + Math.abs(Math.sin(t*st.sp + st.ph))*0.6);
  }

  refreshPlots();

  /* 喷泉水珠 */
  fountainTimer -= dt;
  if(fountainTimer <= 0){
    fountainTimer = 0.16;
    for(const d of S.decor){
      if(d.id === 'fountain'){
        const p = DECOR_SPOTS[d.spot];
        fountainDrop(new THREE.Vector3(p.x, 1.75, p.z));
      }
    }
  }

  /* 路灯火光呼吸（夜间自动点亮，白天熄灭） */
  for(const d of S.decor){
    if(d.id === 'lamp'){
      const g = decorRoot.getObjectByName('decor'+d.spot);
      if(g && g.userData.flicker) g.userData.flicker.intensity = DAY.night * (9 + Math.sin(t*7+d.spot*2)*2.5);
    }
  }

  for(let i=fxList.length-1;i>=0;i--){
    const fx = fxList[i];
    fx.t += dt;
    const k = fx.t / fx.life;
    if(fx.drop){
      if(fx.t < 0.3){
        fx.drop.position.y = fx.base.y + 1.3*(1 - fx.t/0.3);
      } else if(!fx.ring.visible){
        fx.drop.visible = false;
        fx.ring.visible = true;
      }
      if(fx.ring.visible){
        const rk = (fx.t-0.3)/(fx.life-0.3);
        fx.ring.scale.setScalar(0.4 + rk*2.4);
        fx.ring.material.opacity = 1-rk;
      }
    } else {
      const list = fx.single ? [fx.group] : fx.group.children;
      for(const m of list){
        m.userData.v.y -= 5.2*dt;
        m.position.addScaledVector(m.userData.v, dt);
        m.material.rotation = (m.userData.rs||0)*fx.t;
        m.material.opacity = Math.max(0, (m.userData.opacity ?? 1)*(1-k));
      }
    }
    if(k >= 1){
      scene.remove(fx.group);
      fxList.splice(i,1);
    }
  }

  if(Math.abs(displayCoins - S.coins) > 0.5){
    displayCoins += (S.coins - displayCoins) * Math.min(1, dt*8);
    refreshHUD();
  } else if(displayCoins !== S.coins){
    displayCoins = S.coins; refreshHUD();
  }

  composer.render(dt);
}
tick();
</script>
